# Temper 36 — nice!view display config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# LVGL memory — central-half status widget needs significant canvas
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# Extra stack for display thread on central half
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Enable mouse keys
CONFIG_ZMK_POINTING=y
